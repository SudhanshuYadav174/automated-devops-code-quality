name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  code-quality:
    name: Code Quality & Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
      if: hashFiles('package.json') != ''

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
      if: hashFiles('requirements.txt') != '' || hashFiles('pyproject.toml') != ''

    - name: Install dependencies
      run: |
        if [ -f "package.json" ]; then
          npm ci
        fi
        if [ -f "requirements.txt" ]; then
          pip install -r requirements.txt
        fi
        if [ -f "pyproject.toml" ]; then
          pip install .
        fi

    - name: Run Linting
      run: |
        if [ -f "package.json" ]; then
          npm run lint || echo "No lint script found"
        fi
        if [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then
          pip install flake8 black isort
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          black --check . || echo "Black formatting check completed"
          isort --check-only . || echo "Import sorting check completed"
        fi

    - name: Run Tests
      run: |
        if [ -f "package.json" ]; then
          npm test || echo "No test script found"
        fi
        if [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then
          pip install pytest pytest-cov
          pytest --cov=. --cov-report=xml || echo "No tests found"
        fi

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
          -Dsonar.organization=${{ github.repository_owner }}
          -Dsonar.host.url=${{ secrets.SONAR_HOST }}

  security-scanning:
    name: Security Vulnerability Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Snyk to check for vulnerabilities
      uses: snyk/actions/node@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high --sarif-file-output=snyk.sarif

    - name: Upload Snyk results to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: snyk.sarif

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: javascript, python

    - name: Autobuild
      uses: github/codeql-action/autobuild@v2

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2

    - name: Run Trivy vulnerability scanner in repo mode
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      id: depcheck
      with:
        project: 'automated-devops-code-quality'
        path: '.'
        format: 'ALL'
        args: >
          --enableRetired
          --enableExperimental

    - name: Upload Dependency Check results
      uses: actions/upload-artifact@v3
      with:
        name: dependency-check-report
        path: reports/

  supply-chain-security:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate SBOM
      uses: anchore/sbom-action@v0
      with:
        path: ./
        format: spdx-json

    - name: Scan SBOM with Grype
      uses: anchore/scan-action@v3
      with:
        sbom: "./sbom.spdx.json"
        fail-build: false

    - name: License Compliance Check
      uses: fossa-contrib/fossa-action@v2
      with:
        api-key: ${{ secrets.FOSSA_API_KEY }}
      continue-on-error: true

  container-security:
    name: Container Security Scanning
    runs-on: ubuntu-latest
    if: hashFiles('Dockerfile') != ''
    permissions:
      contents: read
      security-events: write
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        load: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Scan Docker image with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ steps.meta.outputs.tags }}
        format: 'sarif'
        output: 'trivy-image-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-image-results.sarif'

    - name: Run Dockle for Docker image linting
      run: |
        curl -L -o dockle.deb https://github.com/goodwithtech/dockle/releases/download/v0.4.10/dockle_0.4.10_Linux-64bit.deb
        sudo dpkg -i dockle.deb
        dockle --format json --output dockle-report.json ${{ steps.meta.outputs.tags }} || true

    - name: Upload Dockle results
      uses: actions/upload-artifact@v3
      with:
        name: dockle-report
        path: dockle-report.json

    - name: Push Docker image
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  infrastructure-security:
    name: Infrastructure as Code Security
    runs-on: ubuntu-latest
    if: hashFiles('**/*.tf') != '' || hashFiles('**/*.yaml') != '' || hashFiles('**/*.yml') != ''

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Checkov IaC scanner
      uses: bridgecrewio/checkov-action@master
      with:
        directory: .
        framework: terraform,kubernetes,dockerfile
        output_format: sarif
        output_file_path: checkov-report.sarif
        download_external_modules: true

    - name: Upload Checkov scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: checkov-report.sarif

    - name: Terraform Security Scan with tfsec
      if: hashFiles('**/*.tf') != ''
      uses: aquasecurity/tfsec-sarif-action@v0.1.4
      with:
        sarif_file: tfsec.sarif

    - name: Upload tfsec results
      if: hashFiles('**/*.tf') != ''
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: tfsec.sarif

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs: [code-quality, security-scanning, dependency-check]
    if: always()

    steps:
    - name: Check Quality Gate Status
      run: |
        echo "Checking quality gate status..."
        echo "Code Quality Job: ${{ needs.code-quality.result }}"
        echo "Security Scanning Job: ${{ needs.security-scanning.result }}"
        echo "Dependency Check Job: ${{ needs.dependency-check.result }}"
        
        if [[ "${{ needs.code-quality.result }}" == "failure" ]]; then
          echo "❌ Code quality checks failed"
          exit 1
        fi
        
        if [[ "${{ needs.security-scanning.result }}" == "failure" ]]; then
          echo "❌ Security scanning failed"
          exit 1
        fi
        
        echo "✅ All quality gates passed"

  deployment:
    name: Deployment
    runs-on: ubuntu-latest
    needs: [quality-gates, supply-chain-security, container-security]
    if: github.ref == 'refs/heads/main' && needs.quality-gates.result == 'success'
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Production
      run: |
        echo "🚀 Deploying to production environment..."
        echo "All security and quality checks passed!"
        # Add your deployment steps here

    - name: Post-deployment Security Scan
      run: |
        echo "Running post-deployment security verification..."
        # Add DAST or other runtime security checks here

  notifications:
    name: Security Notifications
    runs-on: ubuntu-latest
    needs: [quality-gates, security-scanning, dependency-check]
    if: failure()

    steps:
    - name: Notify Security Team
      run: |
        echo "🚨 Security pipeline failed!"
        echo "Please review the security scan results and take appropriate action."
        # Add notification logic (Slack, email, etc.)
name: Secret Scanning & Leak Detection

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run secret scans daily at 3 AM UTC
    - cron: '0 3 * * *'

jobs:
  secret-scanning:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better secret detection

    - name: TruffleHog OSS Secret Scanning
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified

    - name: Gitleaks Secret Detection
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: GitGuardian Secret Scanner
      uses: GitGuardian/ggshield/actions/secret@main
      env:
        GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
        GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
        GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  credential-validation:
    name: Credential Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate API Keys and Tokens
      run: |
        echo "🔍 Validating credentials and API keys..."
        
        # Check for common credential patterns
        echo "Checking for common credential patterns..."
        grep -r "api_key\|apikey\|secret\|password\|token" . --exclude-dir=.git --exclude-dir=node_modules || true
        
        # Check for AWS credentials
        echo "Checking for AWS credential patterns..."
        grep -r "AKIA\|aws_access_key_id\|aws_secret_access_key" . --exclude-dir=.git --exclude-dir=node_modules || true
        
        # Check for database connection strings
        echo "Checking for database connection strings..."
        grep -r "mongodb://\|mysql://\|postgres://\|redis://" . --exclude-dir=.git --exclude-dir=node_modules || true
        
        echo "✅ Credential validation completed"

  environment-secrets-audit:
    name: Environment Secrets Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Audit Required Secrets
      run: |
        echo "📋 Auditing required secrets for DevSecOps pipeline..."
        
        REQUIRED_SECRETS=(
          "SONAR_HOST"
          "SONAR_TOKEN" 
          "SNYK_TOKEN"
          "DOCKER_USERNAME"
          "DOCKER_PASSWORD"
          "FOSSA_API_KEY"
          "GITGUARDIAN_API_KEY"
        )
        
        echo "Required secrets for this pipeline:"
        for secret in "${REQUIRED_SECRETS[@]}"; do
          echo "- $secret"
        done
        
        echo ""
        echo "Optional secrets (for enhanced functionality):"
        echo "- SLACK_WEBHOOK_URL (for notifications)"
        echo "- JIRA_API_TOKEN (for issue tracking integration)"
        echo "- GITHUB_TOKEN (automatically provided by GitHub Actions)"
        
        echo "✅ Secret audit completed"
# SonarQube Configuration
sonar.projectKey=automated-devops-code-quality
sonar.organization=sudhanshuyadav174
sonar.projectName=Automated DevOps Code Quality
sonar.projectVersion=1.0

# Source Code Configuration
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/vendor/**,**/*.test.js,**/*.spec.js,**/coverage/**,**/dist/**,**/build/**

# Test Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=coverage.xml

# Code Quality Rules
sonar.qualitygate.wait=true

# Security Hotspots
sonar.security.hotspots.onlyMainBranch=false

# Duplication
sonar.cpd.exclusions=**/*.min.js

# Language-specific settings
sonar.python.version=3.8,3.9,3.10,3.11
sonar.javascript.environments=node,browser

# Branch analysis
sonar.pullrequest.provider=github
sonar.pullrequest.github.repository=SudhanshuYadav174/automated-devops-code-quality